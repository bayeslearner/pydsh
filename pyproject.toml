[project]
name = "pydsh"
version = "0.2.2"
description = "A Python port of the DeepSeek Harness service layer, built on the plugkit kernel."
authors = [{ name = "Kun Deng", email = "bayeslearner@gmail.com" }]
requires-python = ">=3.13"
# A direct git reference, not a bare name: plugkit is not on PyPI, so a
# consumer installing pydsh must be told where the kernel comes from or
# resolution fails.
#
# Deliberately NO [tool.uv.sources] override here. uv reads this file out of
# the git checkout when a consumer installs pydsh from a tag, so a relative
# path source ("../bayeslearner-microkernel") is resolved as a SUBDIRECTORY of
# this repo and the install fails outright. To work against a local kernel,
# shadow the pinned copy in your venv instead:
#     uv sync && uv pip install -e ../bayeslearner-microkernel
dependencies = [
    "plugkit @ git+https://github.com/bayeslearner/plugkit@v0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The plugkit dependency is a direct git reference (it is not on PyPI),
# which hatchling refuses to build unless told to allow it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pydsh"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
